[package]
name = "web-roamer"
version = "0.2.0"
edition = "2021"
description = "A stylish little web browser in the Board Roamer style"

[dependencies]
tao = "0.34"
wry = { version = "0.53", features = ["devtools"] }
serde_json = "1"
rust-embed = "8"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
soup3 = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
