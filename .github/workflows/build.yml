name: Build and release

# Every push to main builds everything (so a broken build is noticed straight away).
# Pushing a tag like v0.2.0 also publishes a GitHub release with the downloads.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,   os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: .exe }
          - { name: windows-arm64, os: windows-latest,   target: aarch64-pc-windows-msvc,   ext: .exe }
          - { name: macos-arm64,   os: macos-latest,     target: aarch64-apple-darwin }
          - { name: macos-x64,     os: macos-latest,     target: x86_64-apple-darwin }
          - { name: linux-x64,     os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4

      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          perl -0pi -e "s/^version = \"[^\"]*\"/version = \"$V\"/m" Cargo.toml
          grep -m1 '^version' Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir dist
          V="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          cp "target/${{ matrix.target }}/release/web-roamer${{ matrix.ext }}" "dist/web-roamer-${{ matrix.name }}${{ matrix.ext }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            bash .github/scripts/make_app.sh "target/${{ matrix.target }}/release/web-roamer" "$V" "dist/WebRoamer-${{ matrix.name }}.zip"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [desktop]
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Web Roamer ${GITHUB_REF_NAME#v}" \
            --generate-notes
